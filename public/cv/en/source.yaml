      - label: "Data"
        value: "Formula E live race feed"
      - label: "Products"
        value: "Steam VR app → mobile app (iOS)"
      - label: "Engine"
        value: "Unity3D (C#)"
      - label: "Backend"
        value: "Python · Django (first version in .NET)"
      - label: "Shown at"
        value: "Official Formula E events"
