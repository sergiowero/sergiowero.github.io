    summary: "Three years working remotely for Virtually Live, a studio based in Málaga. Everything rested on one thing: the **input data from the Formula E races**, which let us **simulate the race that was happening live**, in a virtual world, only a few minutes behind. On that base we built two products. First a **Steam app**, so that people with a **VR** headset could **watch the race as if they were there** — and even **ride along with the drivers**; the **pool** and **trivia (Jeopardy)** prototypes were meant to live inside it. Then the project **dropped VR** and became a **mobile app** where people watched the race and **competed against the drivers**: that is where we programmed the **game modes**, the **UI** and rules such as the **safety car**. Underneath, a **backend in Python and Django** for accounts and friends — after a first version I wrote in .NET. It went **live on iOS**, and during a race the **Formula E commentators mentioned the players competing in the app**. Alongside, a **VR showroom** of the racing cars' components, used at the official Formula E events."
