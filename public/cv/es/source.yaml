            highlights:
              - "**Histórico de precios:** se guarda cada precio que ha tenido una gasolinera, para que los dueños puedan ver cómo se movieron sus precios y el mercado."
              - "**Precios de la competencia:** la plataforma muestra lo que cobra la competencia alrededor de cada gasolinera."
              - "**Precios automáticos:** los dueños definen sus propias estrategias y el sistema fija los precios de la gasolinera siguiéndolas."
              - "Los clientes usan la herramienta para mantener sus gasolineras al día con el mercado y cuidar los ingresos del negocio."
