              - "Servicios escritos en **.NET**, con los datos de la plataforma en **PostgreSQL**."
              - "El sistema estaba diseñado con **DDD**: las reglas de negocio vivían en un modelo de dominio, y lo que pasaba en él se expresaba como eventos de dominio."
          - id: "wizeline-global-news/many-services-domain-events-and-the-outbox-pattern"
            title: "Muchos servicios, eventos de dominio y el patrón Outbox"
            highlights:
              - "Había muchos servicios, y se comunicaban entre sí por **colas de mensajes** que llevaban **eventos de dominio**, en vez de llamarse directamente."
              - "La publicación seguía el **patrón Outbox**: el evento se guardaba en la base de datos en la misma transacción que el cambio que lo produjo, y desde ahí se enviaba a la cola; así ningún cambio salía sin su evento, ni salía un evento de un cambio que se revirtió."
