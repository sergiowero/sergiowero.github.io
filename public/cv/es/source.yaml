      stack: ["Ruby", "XML", "Automation"]
      highlights:
        - "Desarrollé **APIs en Ruby** para los equipos de validación de hardware y para agilizar los flujos de pruebas."
        - "Creé herramientas y scripts de automatización para sincronizar despliegues de APIs con los entornos cliente en varias sedes globales de Intel."
        - "Usé metaprogramación en Ruby para interpretar documentos de diseño en XML y generar ejecutables de forma dinámica."
    summary: "Dos años en Intel escribiendo **librerías personalizadas en Ruby** para los equipos de validación de hardware. Las librerías son lo que los equipos usan para **validar todos sus diseños de chip antes de mandarlos a simulación real**: entra un documento de diseño en XML y sale el ejecutable que lo revisa, generado al vuelo con metaprogramación en Ruby. Alrededor de las librerías, la automatización que las mantenía desplegadas y sincronizadas en las sedes de Intel en el mundo."
    facts:
      - label: "Área"
        value: "Validación de hardware"
      - label: "Lenguaje"
        value: "Ruby"
      - label: "Entrada"
        value: "Documentos de diseño en XML"
      - label: "Alcance"
        value: "Sedes de Intel en el mundo"
    highlights: []
    sections:
      - id: "intel/custom-ruby-libraries-for-validation"
        title: "Librerías personalizadas en Ruby para validación"
        highlights:
          - "El centro del trabajo: **librerías escritas específicamente para validación**, en Ruby, hechas para los equipos de validación de hardware y no tomadas de fuera."
          - "Los equipos usan la librería para **validar todos los diseños de chip** que producen **antes de mandarlos a simulación real**: un diseño no llega al simulador hasta que la librería lo ha revisado."
          - "Detectar un problema en esta etapa es lo que hace que la librería valga la pena: la simulación real es el paso caro, y un diseño que falla ahí cuesta mucho más que uno que falla una revisión en Ruby."
          - "Expuestas como **APIs en Ruby** para que cada equipo pudiera integrar la validación en su propio flujo de pruebas."
      - id: "intel/from-xml-design-documents-to-executables-with-metaprogramming"
        title: "De documentos de diseño en XML a ejecutables, con metaprogramación"
        highlights:
          - "Los diseños de chip llegaban como **documentos de diseño en XML**."
          - "La librería interpretaba esos documentos y, con **metaprogramación en Ruby**, **generaba los ejecutables de forma dinámica** a partir de lo que describía el documento: el código que validaba un diseño se construía desde el diseño mismo, no se escribía a mano para cada uno."
      - id: "intel/deployment-automation-across-intel-sites"
        title: "Automatización de despliegues entre sedes de Intel"
        highlights:
          - "Los equipos de validación estaban repartidos en **varias sedes de Intel en el mundo**, cada una con su propio entorno cliente."
          - "Escribí las **herramientas y scripts de automatización** que sincronizaban los despliegues de las APIs con esos entornos, para que todas las sedes corrieran la misma versión de las librerías."
    achievements:
      - id: "intel/moved-the-project-from-svn-to-git"
        kind: "milestone"
        kind_label: "Hito"
        title: "Migración del proyecto de SVN a Git"
        subtitle: "Iniciativa mía: la propuse y la llevé a cabo"
        highlights:
          - "El proyecto vivía en **SVN**. Propuse la iniciativa de pasarlo a **Git** y llevé el cambio."
          - "Con las ramas de Git, cada persona podía **trabajar en varias funcionalidades al mismo tiempo**, y trabajar en conjunto sobre el mismo código se volvió más fácil."
          - "El **CI/CD** construido encima quedó **más simple y más moderno** que lo que SVN permitía."
        result_label: "Resultado"
        result: "Colaboración más fácil en funcionalidades en paralelo, y un CI/CD simplificado y modernizado."
        skills: ["SVN", "Git", "CI/CD"]
    stack:
