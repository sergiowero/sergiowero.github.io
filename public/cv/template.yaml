# The look of https://sergiowero.github.io/ as a spec for CV generators. Schema cv-template/1.
# Written by tools/gen.py; do not edit by hand. Data: /cv/{lang}/source.yaml. Stylesheet: /cv/cv.css.
meta:
  schema: "cv-template/1"
  name: "Dark Terminal"
  generated: "2026-09-28"
  url: "https://sergiowero.github.io/cv/template.yaml"
  stylesheet: "https://sergiowero.github.io/cv/cv.css"
  reference: "https://sergiowero.github.io/"
  sources:
    en: "https://sergiowero.github.io/cv/en/source.yaml"
    es: "https://sergiowero.github.io/cv/es/source.yaml"
  units: "px are CSS px (1px = 1/96 in = 0.75 pt); mm are mm."
  colors: "Color values name a token from `tokens`; rgba() values are literal."
  data_paths: "Dotted paths into source.yaml; [*] means every item."
  authority: "cv.css is the live stylesheet; if a rule here disagrees with it, cv.css wins."
page:
  size: "A4"
  width_mm: 210
  height_mm: 297
  pages: 1
  padding_mm:
    top: 11
    right: 12
    bottom: 4
    left: 12
  text:
    font: "sans"
    size_px: 10
    line_height: 1.5
    color: "text"
  background:
    color: "bg"
    image: "radial-gradient(500px 260px at 90% -5%, rgba(76,201,240,.10), transparent 60%), radial-gradient(420px 220px at 0% 8%, rgba(61,220,132,.09), transparent 60%)"
  fit: "One A4 page in both languages; Spanish runs about 15% longer than English."
fonts:
  sans:
    family: "Inter"
    weights: [400, 500, 600, 700]
    fallback: "system-ui, sans-serif"
  mono:
    family: "JetBrains Mono"
    weights: [400, 500, 700]
    fallback: "Menlo, Consolas, monospace"
  stylesheet: "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap"
tokens:
  light:
    bg: "#f6f8fa"
    panel: "#fff"
    line: "#d0d7de"
    text: "#1f2328"
    muted: "#6e7781"
    green: "#1a7f37"
    cyan: "#0969da"
    amber: "#9a6700"
    pink: "#bf3989"
    fg: "#0b1220"
    body_text: "#3d444d"
    empty: "#d8dee4"
  dark:
    bg: "#0b0f14"
    panel: "#141b23"
    line: "#1f2a35"
    text: "#d6dde6"
    muted: "#7d8a99"
    green: "#3ddc84"
    cyan: "#4cc9f0"
    amber: "#ffb454"
    pink: "#ff6b9d"
    fg: "#fff"
    body_text: "#b9c3cf"
    empty: "#33414f"
themes:
  default: "light"
  dark: "Set data-theme=\"dark\" on <html> with cv.css; the PDF keeps the theme on screen."
  ats: "Always light."
color_roles:
  bg: "page background"
  panel: "tiles and chips"
  line: "borders and dashed separators"
  text: "default text, contact links, chip text"
  fg: "strongest text: name, titles, bold, degree and language names"
  body_text: "paragraphs and bullets"
  muted: "secondary text: dates, locations, prompts, labels"
  green: "accent: heading prefix, bullet markers, current job's dates, skill meters, AI card, language levels"
  cyan: "organization names, links, industry tags"
  amber: "role separators and the file name in the prompt"
  pink: "timeline training cards (not on the one-page CV)"
  empty: "unfilled skill-meter cells"
layout:
  order: ["header", "stats", "columns", "footer"]
  header:
    direction: "row"
    justify: "space-between"
    align: "end"
    gap_mm: 8
    left: ["prompt", "name", "roles_line"]
    right: ["contact_line"]
  stats:
    component: "stat_tile"
    tiles: ["years", "industries", "max_led", "best_skills"]
    gap_px: 6
    margin_px:
      top: 5
      bottom: 5
    data: "stats[*]"
  columns:
    gap_mm: 7
    main:
      width: "fill"
      sections: ["profile", "experience"]
    aside:
      width_mm: 54
      sections: ["ai_assisted", "core_skills", "technologies", "education", "languages"]
  footer:
    component: "footer"
    position: "page bottom"
  section_gap_px: 8
sections:
  profile:
    heading: "labels.sections.profile"
    data: "profile.summary"
    component: "paragraph"
  experience:
    heading: "labels.sections.experience"
    data: "experience[*]"
    component: "job"
    uses: "title, organization, dates, location, industries and cv.highlights (the one-page bullets); cv.current marks the current job"
  ai_assisted:
    heading: null
    data: "skills.ai_assisted"
    component: "ai_card"
  core_skills:
    heading: "labels.sections.core_skills"
    data: "skills.core[*]"
    component: "skill_meter"
  technologies:
    heading: "labels.sections.technologies"
    data: "skills.technologies"
    component: "chip"
  education:
    heading: "labels.sections.education"
    data: "education[*].cv"
    component: "education_item"
  languages:
    heading: "labels.sections.languages"
    data: "languages[*]"
    component: "language_item"
components:
  prompt:
    font: "mono"
    size_px: 8.6
    color: "muted"
    parts:
      - text: "sergio"
        color: "green"
      - text: "@"
      - text: "sergiowero.github.io"
        color: "cyan"
      - text: ":~$ cat "
      - text: "cv.md"
        color: "amber"
    print: "hidden"
  name:
    data: "profile.name"
    font: "sans"
    size_px: 29
    weight: 700
    letter_spacing_px: -1
    line_height: 1
    color: "fg"
    margin_top_px: 5
    screen:
      cursor: "a blinking green block after the name (0.45em x 0.9em, 1s steps)"
      typing: "the name is typed in by script on load"
    print: "the name alone, no cursor"
  roles_line:
    data: "profile.roles"
    font: "mono"
    size_px: 9
    color: "muted"
    margin_top_px: 5
    first:
      color: "green"
      weight: 600
      size_px: 10
      letter_spacing_px: -0.1
    separator:
      text: " / "
      color: "amber"
  contact_line:
    data: "contact[*]"
    size_px: 8.4
    color: "muted"
    link_color: "text"
    row_gap_px: 3
    icon:
      source: "icons.<contact.icon>"
      size_px: 11
      stroke: "green"
      stroke_width: 2
      fill: "none"
      gap_px: 6
  stat_tile:
    background: "panel"
    border: "1px solid line"
    radius_px: 8
    padding_px:
      vertical: 6
      horizontal: 8
    flex: 1
    flex_tags: 1.35
    label_above_value: true
    gap_px: 4
    label:
      font: "mono"
      size_px: 7.6
      color: "muted"
      transform: "lowercase"
      prefix: "// "
      print:
        font: "sans"
        transform: "none"
        prefix: null
    number:
      font: "mono"
      size_px: 17
      weight: 700
      color: "fg"
      line_height: 1
      letter_spacing_px: -0.5
      suffix_color: "green"
    tags:
      font: "mono"
      size_px: 7.6
      weight: 700
      color: "green"
      background: "rgba(61,220,132,.10)"
      border: "1px solid rgba(61,220,132,.45)"
      radius_px: 4
      padding_px:
        vertical: 1
        horizontal: 6
      gap_px: 3
  section_heading:
    margin_bottom_px: 6
    screen:
      text: "labels.sections.<key>.screen"
      font: "mono"
      size_px: 8.6
      weight: 500
      color: "muted"
      prefix:
        text: "➜ ~ "
        color: "green"
    print:
      text: "labels.sections.<key>.print"
      font: "sans"
      size_px: 9.4
      weight: 700
      color: "fg"
      transform: "uppercase"
      letter_spacing_px: 0.7
      border_bottom: "1px solid line"
      padding_bottom_px: 3
  paragraph:
    size_px: 9.5
    line_height: 1.5
    color: "body_text"
    bold:
      color: "fg"
      weight: 600
  job:
    padding_px:
      top: 6
      bottom: 4
    separator: "1px dashed line above every job but the first"
    head:
      direction: "row"
      justify: "space-between"
      align: "baseline"
      gap_px: 8
    title:
      text: "{title} · {organization}"
      size_px: 11
      weight: 600
      color: "fg"
      organization_color: "cyan"
    dates:
      text: "{dates.text} · {duration}"
      font: "mono"
      size_px: 7.8
      color: "muted"
      current_color: "green"
      wrap: false
      duration: "months from start to end (or today), counting both ends, as '6 yrs 7 mos' with labels.duration_units; weight 400, opacity 0.85"
    location:
      size_px: 8.2
      color: "muted"
      then: "industry_tag list, margin-left 6px, gap 3px"
    highlights: "bullet list of cv.highlights"
  industry_tag:
    font: "mono"
    size_px: 7.4
    weight: 700
    color: "cyan"
    background: "rgba(76,201,240,.12)"
    border: "1px solid rgba(76,201,240,.45)"
    radius_px: 4
    padding_px:
      vertical: 1
      horizontal: 6
    line_height: 1.35
    prefix:
      text: "#"
      color: "rgba(76,201,240,.6)"
      print: null
  bullet:
    size_px: 9.1
    line_height: 1.35
    color: "body_text"
    indent_px: 12
    gap_px: 2.5
    list_margin_top_px: 2
    marker:
      screen:
        text: ">"
        font: "mono"
        weight: 700
        color: "green"
      print:
        text: "•"
        weight: 400
    bold:
      color: "fg"
      weight: 600
    link:
      color: "cyan"
    stack_suffix:
      match: "a trailing 'Tech: …' sentence"
      color: "muted"
  ai_card:
    background: "linear-gradient(160deg, rgba(61,220,132,.10), rgba(76,201,240,.07))"
    border: "1px solid rgba(61,220,132,.35)"
    radius_px: 9
    padding_px:
      vertical: 9
      horizontal: 10
    title:
      data: "skills.ai_assisted.title"
      font: "mono"
      size_px: 8.4
      color: "green"
      prefix:
        text: "// "
        color: "muted"
      margin_bottom_px: 4
    text:
      data: "skills.ai_assisted.text"
      size_px: 8.8
      line_height: 1.45
      color: "body_text"
      margin_bottom_px: 6
    tools:
      data: "skills.ai_assisted.tools"
      component: "chip"
      color: "green"
      border: "1px solid rgba(61,220,132,.4)"
      background: "transparent"
    print_ats:
      background: "none"
      border: "1px solid line"
  skill_meter:
    padding_px:
      top: 2
      bottom: 3
    name:
      data: "name"
      size_px: 9
      weight: 500
      color: "text"
    percent:
      data: "percent"
      text: "{percent}%"
      font: "mono"
      size_px: 8.4
      color: "green"
      align: "right"
    meter:
      font: "mono"
      size_px: 8.6
      line_height: 1.25
      margin_top_px: 1
      cells: "max"
      filled:
        char: "█"
        color: "green"
        count: "level"
      empty:
        char: "░"
        color: "empty"
      brackets:
        text: "[]"
        color: "muted"
    print_ats:
      meter: "hidden"
      word:
        data: "word"
        color: "muted"
  chip:
    font: "mono"
    size_px: 7.6
    padding_px:
      vertical: 2
      horizontal: 6
    radius_px: 4
    background: "panel"
    border: "1px solid line"
    color: "text"
    wrap: true
    gap_px: 4
  education_item:
    padding_px:
      vertical: 3
    separator: "1px dashed line between items"
    degree:
      data: "cv.degree"
      size_px: 9.5
      weight: 600
      color: "fg"
    detail:
      data: "cv.detail"
      size_px: 8.2
      color: "muted"
  language_item:
    direction: "row"
    justify: "space-between"
    align: "baseline"
    gap_px: 8
    padding_px:
      vertical: 3
    separator: "1px dashed line between items"
    name:
      data: "name"
      size_px: 9.5
      weight: 600
      color: "fg"
    level:
      data: "level"
      font: "mono"
      size_px: 8.2
      color: "green"
    print_ats: "one line: '{name} — {level}'"
  footer:
    font: "mono"
    size_px: 7.6
    color: "muted"
    border_top: "1px solid line"
    padding_top_px: 5
    justify: "space-between"
    left:
      text: "➜ exit 0 · {profile.name}"
      arrow_color: "green"
    right:
      text: "sergiowero.github.io"
    print: "hidden"
modes:
  screen: "The look above; light by default, dark with tokens.dark."
  print: "PDF: the screen look and theme, minus the prompt, the footer and the name's cursor; headings switch to their print form, bullets to '•', and the '#' of industry tags and '// ' of stat labels are dropped."
  print_ats: "PDF ATS: print, plus forced light and one column (main, then everything from the aside, full width); skill meters become their word, the AI card loses its tint, languages become one line each. In cv.css: data-print=\"ats\" on <html>."
  docx: "DOCX ATS: one column, light, the print headings; see public/cv-export.js on the site."
icons:
  pin: "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\"><path d=\"M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z\"/><circle cx=\"12\" cy=\"10\" r=\"2.5\"/></svg>"
  phone: "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\"><path d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z\"/></svg>"
  mail: "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg>"
  in: "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M7 10v7M7 7v.01M11 17v-4a2 2 0 0 1 4 0v4\"/></svg>"
  gh: "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\"><path d=\"M9 19c-4.5 1.5-4.5-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21\"/></svg>"
  tl: "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\"><circle cx=\"6\" cy=\"5\" r=\"2\"/><circle cx=\"6\" cy=\"12\" r=\"2\"/><circle cx=\"6\" cy=\"19\" r=\"2\"/><path d=\"M6 7v3M6 14v3M11 5h9M11 12h9M11 19h6\"/></svg>"
markup:
  note: "HTML that cv.css styles, as the live CV renders it (English). $…$ in the skeleton are filled with the components below; labels.sections.<key> fill the headings ($L_…$)."
  skeleton: "<div class=\"sheet\">\n  <header class=\"top\">\n    <div>\n      <div class=\"prompt mono\"><span class=\"g\">sergio</span>@<span class=\"c\">sergiowero.github.io</span>:~$ cat <span class=\"f\">$L_CVFILE$</span></div>\n      <div class=\"name\"><span id=\"typed\">$NAME$</span><span class=\"cur\"></span></div>\n      <div class=\"sub mono\">$L_SUB$</div>\n    </div>\n    <div class=\"contact\">$CONTACT$</div>\n  </header>\n  $STATS$\n  <div class=\"cols\">\n    <main class=\"main\">\n      <section><h2 class=\"sh\">$L_PROFILE$</h2>$PROFILE$</section>\n      <section><h2 class=\"sh\">$L_EXP$</h2>$EXP$</section>\n    </main>\n    <aside class=\"aside\">\n      <section>$AI$</section>\n      <section><h2 class=\"sh\">$L_CORE$</h2>$CORE$</section>\n      <section><h2 class=\"sh\">$L_TECH$</h2>$TECH$</section>\n      <section><h2 class=\"sh\">$L_EDU$</h2>$EDU$</section>\n      <section><h2 class=\"sh\">$L_LANG$</h2>$LANGS$</section>\n    </aside>\n  </div>\n  <div class=\"foot\"><span><span class=\"g\">➜</span> exit 0 · $NAME$</span><span>sergiowero.github.io</span></div>\n</div>"
  components:
    header: "<header class=\"top\">\n    <div>\n      <div class=\"prompt mono\"><span class=\"g\">sergio</span>@<span class=\"c\">sergiowero.github.io</span>:~$ cat <span class=\"f\">cv.md</span></div>\n      <div class=\"name\"><span id=\"typed\">Sergio de Jesús Sánchez Robles</span><span class=\"cur\"></span></div>\n      <div class=\"sub mono\"><span class=\"r0\">Senior Software Engineer</span> <span class=\"hl\">/</span> Tech Lead <span class=\"hl\">/</span> Backend &amp; Full-Stack <span class=\"hl\">/</span> Game Dev <span class=\"hl\">/</span> AI-Assisted</div>\n    </div>\n    <div class=\"contact\"><div class=\"cline\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\"><path d=\"M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z\"/><circle cx=\"12\" cy=\"10\" r=\"2.5\"/></svg>Zapopan, Jalisco, México</div>\n<div class=\"cline\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\"><path d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z\"/></svg><a href=\"tel:+5213317991812\">+52 1 33 1799 1812</a></div>\n<div class=\"cline\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><path d=\"M3 7l9 6 9-6\"/></svg><a href=\"mailto:sergioj.sanchezr@gmail.com\">sergioj.sanchezr@gmail.com</a></div>\n<div class=\"cline\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M7 10v7M7 7v.01M11 17v-4a2 2 0 0 1 4 0v4\"/></svg><a href=\"https://www.linkedin.com/in/sergiojsanchez/\" target=\"_blank\" rel=\"noopener noreferrer\">linkedin.com/in/sergiojsanchez</a></div>\n<div class=\"cline\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\"><path d=\"M9 19c-4.5 1.5-4.5-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21\"/></svg><a href=\"https://github.com/sergiowero\" target=\"_blank\" rel=\"noopener noreferrer\">github.com/sergiowero</a></div>\n<div class=\"cline\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\"><circle cx=\"6\" cy=\"5\" r=\"2\"/><circle cx=\"6\" cy=\"12\" r=\"2\"/><circle cx=\"6\" cy=\"19\" r=\"2\"/><path d=\"M6 7v3M6 14v3M11 5h9M11 12h9M11 19h6\"/></svg><a href=\"https://sergiowero.github.io/timeline/\" target=\"_blank\" rel=\"noopener noreferrer\">Explore my full career →</a></div></div>\n  </header>"
    stats: "<div class=\"stats\"><div class=\"stat\"><div class=\"n\">16<span class=\"u\">+</span></div><div class=\"l\">Years building software</div></div><div class=\"stat best\"><div class=\"n\"><span class=\"bs\">Gaming</span><span class=\"bs\">Media</span><span class=\"bs\">Enterprise</span></div><div class=\"l\">Industries</div></div><div class=\"stat\"><div class=\"n\">6<span class=\"u\"></span></div><div class=\"l\">Max engineers led</div></div><div class=\"stat best\"><div class=\"n\"><span class=\"bs\">.NET</span><span class=\"bs\">Spring</span><span class=\"bs\">Python</span><span class=\"bs\">Node.js</span></div><div class=\"l\">Best skills</div></div></div>"
    section: "<section><h2 class=\"sh\"><span class=\"cmd\">cat profile.md</span><span class=\"ats\">Professional Summary</span></h2><p class=\"profile\">Software developer with <b>16 years of experience</b> across the gaming, media, and enterprise sectors, collaborating with major global companies. As an <b>AI enthusiast</b>, I actively leverage AI-assisted tools in my daily workflow to optimize backend development and accelerate project delivery. I am a rapid learner, highly adaptable to new technology stacks. Having previously <b>led teams of up to six people</b>, I consistently deliver high-quality, scalable software solutions on time and within budget.</p></section>"
    job: "<div class=\"job cur\">\n<div class=\"job-head\"><div class=\"r\">Senior Software Engineer / Tech Lead · <span class=\"c\">Wizeline</span></div><div class=\"p\" data-from=\"2020-03\">Mar 2020 - Present</div></div>\n<div class=\"loc\">Guadalajara, México<span class=\"inds\"><span class=\"ind\">News</span><span class=\"ind\">Media &amp; Entertainment</span><span class=\"ind\">Retail</span><span class=\"ind\">Cybersecurity</span></span></div>\n<ul class=\"pts\"><li><b>Dow Jones:</b> Engineered new features and resolved production issues in a high-velocity environment. Leveraged AI tooling to accelerate development cycles and enhance code quality. <span class=\"stack\">Tech: .NET, AWS, PostgreSQL, Claude Code.</span></li><li><b>Fox Corp:</b> Directed a team of 5 engineers as Tech Lead, designing and implementing customized, scalable software solutions for internal stakeholders. <span class=\"stack\">Tech: Java, Spring, Node.js, AWS, PostgreSQL.</span></li><li><b>Inditex:</b> Architected backend services for a complex audit system. Designed relational databases, implemented microservices, and built migration services for long-running data imports. <span class=\"stack\">Tech: Java, Spring, MariaDB.</span></li><li><b>Cerby:</b> Spearheaded the full-stack development of an MVP as a contingent engineer to successfully launch the initial platform. <span class=\"stack\">Tech: Python, React.</span></li></ul>\n</div>"
